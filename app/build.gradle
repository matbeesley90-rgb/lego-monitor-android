plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lego.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.lego.monitor"
        minSdk 26
        targetSdk 34
        // 2026-09-18: versionCode moves with every build from now on so
        // "which build is on the phone" is answerable from the package
        // manager (it sat at 10 from 0.2.1 to 0.2.18).
        versionCode 11
        versionName "0.2.19"
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // OkHttp for the WebSocket client. 4.12.0 supports min-SDK 21+.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // (lifecycle-service dropped 2026-09-18: WebSocketService extends
    // android.app.Service and never used it.)
}
