name: Build debug APK

on:
  push:
    # 2026-09-18: all app work lives on claude/price-in-title (54 commits
    # ahead of main, never CI-built) — build it on push too.
    branches: [main, claude/price-in-title]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      # Stable signing key. Preferred source (2026-09-18): the Pi's
      # permanent debug keystore as a base64 repo secret
      # (ANDROID_DEBUG_KEYSTORE_B64 = ~/.lego-monitor-signing/debug.keystore.b64).
      # The actions/cache path below is only a fallback while the secret
      # is absent: a fixed cache key never updates and is evicted after
      # 7 days unused, and every eviction silently minted a fresh key —
      # the "CI signs with a new key every build" failure. Until the
      # secret is confirmed working, ~/.lego-monitor-signing/resign.sh
      # on the downloaded APK stays mandatory.
      - name: Restore debug keystore from secret
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "from_secret=1" >> "$GITHUB_OUTPUT"
            echo "keystore: restored from secret"
          else
            echo "from_secret=0" >> "$GITHUB_OUTPUT"
            echo "keystore: secret not set — falling back to the cache"
          fi

      - name: Cache debug keystore (fallback when no secret)
        if: steps.ks.outputs.from_secret != '1'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Ensure stable debug keystore exists
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lego-monitor-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
